[workspace]
resolver = "3"
members = [
    "crates/framework-core",
    "crates/framework-windows",
    "examples/hello-label",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A Rust-first, native-control-oriented cross-platform application framework"
repository = "https://github.com/<org>/RustNative"
homepage = "https://github.com/<org>/RustNative"
keywords = ["gui", "windows", "native", "framework", "ui"]
categories = ["gui", "os::windows-apis"]

[workspace.dependencies]
framework-core = { path = "crates/framework-core" }
framework-windows = { path = "crates/framework-windows" }
tokio = { version = "1.53", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync"] }
parking_lot = "0.12"
async-trait = "0.1"
windows-sys = { version = ">=0.59, <=0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls_Dialogs",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
too_many_arguments = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
