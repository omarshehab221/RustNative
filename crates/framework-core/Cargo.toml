[package]
name = "framework-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "framework_core"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
tokio.workspace = true
parking_lot.workspace = true
async-trait.workspace = true
# Milestone 30's persistence serializes component state and navigation
# stacks; `serde_json` is the on-disk format (readable when debugging a
# state file, and forgiving of fields added in a later version).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Before Milestone 30 this enabled `Serialize`/`Deserialize` on the id
# types, ahead of persistence. Persistence is now part of the core, so
# serde always is; the feature is kept, empty, so a manifest that asks for
# it still builds.
serde = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util"] }
proptest = "1"

[[bench]]
name = "core_benchmarks"
harness = false

[dev-dependencies.criterion]
version = "0.5"
