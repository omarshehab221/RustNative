[package]
name = "framework-windows"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
framework-core.workspace = true
tokio.workspace = true
async-trait.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# Used only by `services::dialogs` for the modern `IFileOpenDialog`/
# `IFileSaveDialog` COM interfaces: `windows-sys` (used everywhere else in
# this crate) deliberately provides flat FFI bindings only — no COM
# interface/vtable definitions at all (confirmed by their absence from its
# own source) — so implementing these by hand against raw `windows-sys`
# would mean re-deriving each interface's GUID, vtable layout, and calling
# convention from Microsoft's documentation with no compiler or bindings-
# crate help catching a mistake. `windows` provides the real, maintained
# bindings for exactly this; every other file in this crate has no reason
# to pull in COM interface support it doesn't use, hence this dependency
# being scoped to the one module that needs it via minimal features below
# rather than added workspace-wide.
windows = { version = ">=0.60, <=0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    # `Win32_System_Variant` and `Win32_UI_Accessibility` are the second
    # place this crate needs real COM interfaces rather than flat bindings:
    # `native::rendering::accessibility` uses `IAccPropServices` (Microsoft's
    # Dynamic Annotation API) to give a standard control an accessible name,
    # description, or role that differs from what the control reports on its
    # own — the mechanism that closes the standards audit's P1.16 finding
    # without writing a full UI Automation provider. `windows-sys` has no
    # COM interface definitions at all, so as with the file dialogs above,
    # a `windows-sys`-only implementation would mean hand-deriving the
    # interface's GUID and vtable layout with no compiler help.
    # `Win32_System_Ole` is not used directly; it is the feature the
    # `windows` crate gates `VARIANT` (and therefore
    # `IAccPropServices::SetHwndProp`) behind.
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
