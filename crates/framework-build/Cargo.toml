[package]
name = "framework-build"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Build-script support for Rust Native applications: icons, manifests, and version resources"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["gui", "windows", "build-dependencies", "resources", "manifest"]
categories = ["development-tools::build-utils", "gui"]

[lints]
workspace = true

[dependencies]
framework-markup.workspace = true
# The message catalogues `compile_messages` checks and types (Milestone 46).
framework-i18n.workspace = true
framework-style = { workspace = true, features = ["tokens"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
