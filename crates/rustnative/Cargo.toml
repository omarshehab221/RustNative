[package]
name = "rustnative-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The rustnative command: create, check, build, run, and diagnose Rust Native applications"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["gui", "cli", "windows", "native", "framework"]
categories = ["command-line-utilities", "gui"]

[lints]
workspace = true

[[bin]]
name = "rustnative"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Packaging: a reproducible ZIP needs CRC-32 per entry, and `SHA256SUMS`
# needs SHA-256. Both are small, dependency-free, and widely audited.
crc32fast = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"


[dev-dependencies]
sha2 = "0.10"

[target.'cfg(windows)'.dev-dependencies]
# The packaging tests read a built executable's version resource and
# manifest back out of it, which is what proves `framework-build` embedded
# them rather than only writing a script.
windows-sys = { workspace = true }
