[package]
name = "rustnative-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The rustnative command: create, check, build, run, and diagnose Rust Native applications"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["gui", "cli", "windows", "native", "framework"]
categories = ["command-line-utilities", "gui"]

[lints]
workspace = true

[[bin]]
name = "rustnative"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# The markup syntax: `expand`, `fmt`, `lsp`, and `.rsx` diagnostics link the
# same parser and lowering the `rsx!` macro uses.
framework-markup.workspace = true
framework-style.workspace = true
framework-interop.workspace = true
# `inspect` speaks the runtime's inspection protocol (Milestone 44).
framework-core.workspace = true
# `i18n` reads catalogues the way the build does (Milestone 46).
framework-i18n.workspace = true
# The style file's location, read the way the build script reads it.
framework-build.workspace = true
# `db` generates, applies, and squashes migrations (Milestone 49).
framework-server.workspace = true
prettyplease = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
# Packaging: a reproducible ZIP needs CRC-32 per entry, and `SHA256SUMS`
# needs SHA-256. Both are small, dependency-free, and widely audited.
crc32fast = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"


[dev-dependencies]
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dev-dependencies]
# The packaging tests read a built executable's version resource and
# manifest back out of it, which is what proves `framework-build` embedded
# them rather than only writing a script.
windows-sys = { workspace = true }
