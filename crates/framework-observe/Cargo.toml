[package]
name = "framework-observe"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# Milestone 51: structured logs, metrics, and traces.
[dependencies]
framework-core.workspace = true
framework-server = { workspace = true, optional = true }
async-trait.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Tracing `framework-server` requests.
server = ["dep:framework-server"]

[dev-dependencies]
# The tests trace a server, so they need the `server` feature on.
framework-observe = { path = ".", features = ["server"] }
framework-server.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
