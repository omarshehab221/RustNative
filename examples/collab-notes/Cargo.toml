[package]
name = "collab-notes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

# Milestone 55's collaborative example: a document edited offline on two
# devices, converging through the sync service.
[dependencies]
framework-core.workspace = true
framework-sync = { workspace = true, features = ["server"] }
framework-server.workspace = true
framework-windows.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["sync", "net", "rt-multi-thread", "macros"] }

[dev-dependencies]
framework-headless.workspace = true
