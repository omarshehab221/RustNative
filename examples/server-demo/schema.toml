# The model `rustnative db diff` compares with migrations/.
[tables.users]
columns = [
  { name = "id", type = "INTEGER", primary_key = true },
  { name = "name", type = "TEXT", not_null = true },
  { name = "password_hash", type = "TEXT", not_null = true },
  { name = "admin", type = "INTEGER", not_null = true, default = "0" },
]

[tables.notes]
columns = [
  { name = "id", type = "INTEGER", primary_key = true },
  { name = "owner", type = "INTEGER", not_null = true },
  { name = "title", type = "TEXT", not_null = true },
  { name = "indexed", type = "INTEGER", not_null = true, default = "0" },
]
