[package]
name = "server-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

# Milestone 49's client: the Windows application calling the notes server
# through the typed server functions it shares with it (notes-shared).
# It does not depend on the server crate.
[dependencies]
framework-core.workspace = true
framework-windows.workspace = true
notes-shared = { path = "../notes-shared", version = "0.1.0" }
serde_json = "1"

[dev-dependencies]
framework-headless.workspace = true
framework-server.workspace = true
server-demo = { path = "../server-demo", version = "0.1.0" }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros"] }
