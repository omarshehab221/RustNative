# The Windows backend's budgets (`PLAN.md` Milestone 42). See SCHEMA.md for
# every key's meaning and scenario. `max` is the budget; a measurement fails
# `rustnative bench --check` above `max × (1 + tolerance)`. Tolerances are the
# noise observed across repeated runs on the reference machine (a shared
# desktop); a key measured as a median of several runs has less.
#
# Reference machine: the development desktop these were first measured on
# (Windows 10 22H2, x86-64). Measured values at the time, for the record, are
# in the comments; the budget is what may not be exceeded.
target = "windows"

[budget]
# Startup phases, from the process's creation (median of 5 runs).
runtime_ready_ms = { max = 80, tolerance = 1.0 }          # 50
first_frame_ms = { max = 400, tolerance = 0.75 }          # 300–400
first_content_ms = { max = 400, tolerance = 0.75 }        # 300–400
interactive_ms = { max = 450, tolerance = 0.75 }          # 340–430
cold_start_ms = { max = 450, tolerance = 0.75 }           # 340–430
resident_memory_mb = { max = 24, tolerance = 0.1 }        # 17.4–18.3
artifact_size_kb = { max = 3500, tolerance = 0.05 }       # 3060

# Frame times of a running size transition.
frame_time_p50_ms = { max = 17.5, tolerance = 0.1 }       # 16.7
frame_time_p99_ms = { max = 34, tolerance = 0.5 }         # 19–35
frame_time_max_ms = { max = 60, tolerance = 1.0 }         # 32–104

# A click posted to the real button window, to the change realized
# (median of 3 runs of 31 clicks).
input_latency_ms = { max = 16, tolerance = 0.5 }          # 7–13
input_latency_max_ms = { max = 30, tolerance = 1.0 }      # 10–20

# The shared core, on a tree of a thousand nodes.
tree_diff_us_1k_nodes = { max = 600, tolerance = 1.0 }    # 270–800
layout_us_1k_nodes = { max = 900, tolerance = 1.0 }       # 530–1280
render_us_1k_nodes = { max = 5000, tolerance = 1.5 }      # 2900–10600

# The markup and style compile steps.
rsx_compile_ms_per_kloc = { max = 12, tolerance = 1.0 }   # 6–20
class_resolve_us = { max = 30, tolerance = 1.0 }          # 10–39

# Build time (`--build-times`): `examples/hello-label`, debug.
build_time_clean_s = { max = 300, tolerance = 0.5, optional = true }       # 234
build_time_incremental_s = { max = 15, tolerance = 0.5, optional = true }  # 10
